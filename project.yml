name: BCITest
options:
  bundleIdPrefix: com.ismaelalvarez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BCITest:
    type: application
    platform: iOS
    sources:
      - path: Sources/BCITest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismaelalvarez.bcitest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Sources/BCITest/Info.plist
      properties:
        CFBundleDisplayName: "BCI Test"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  BCITestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/BCITestTests
    dependencies:
      - target: BCITest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismaelalvarez.bcitest.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BCITest:
    build:
      targets:
        BCITest: all
        BCITestTests: [test]
    test:
      config: Debug
      targets:
        - BCITestTests
    run:
      config: Debug
